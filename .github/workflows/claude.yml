# Claude on request (docs/pull-request-gates.md § 4): mention `@claude` in a
# comment on a PR or an issue and Claude answers in the thread or pushes a
# change to the PR branch. This is how a non-technical teammate asks for a
# fix ("@claude the Save button only shows a message, make it save") and
# how a junior developer asks for the review findings to be implemented
# ("@claude fix the blocking findings").
#
# Only the PR's conversation comments trigger it, not inline review comments:
# every reviewer bot's inline comment would otherwise start a run of its own.
# Only people with write access can trigger it (the action's default).
#
# Claude's push has to start the checks and the review again. A push made
# with the workflow's own token does not: GitHub creates the runs and holds
# every one of them for a person's approval.
# So the action is given the automation App's token when the App exists
# (docs/pull-request-gates.md § 7 step 6); until then a lead approves the
# held runs in the Actions tab after each push Claude makes.
name: Claude

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Is the key set?
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set (docs/pull-request-gates.md § 7)."
            exit 1
          fi

      - name: App token
        id: app
        if: vars.AUTOMATION_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Checked out with the App's token, so the credential the checkout
          # persists is the App's: the action's first `git fetch` of the PR
          # head needs one (with none persisted it died on "could not read
          # Username", Oct 29, 2026), and a push with it arrives as the App,
          # so the runs it starts are not held. With GITHUB_TOKEN persisted
          # instead, Claude's pushes arrived as github-actions[bot] and every run was held.
          token: ${{ steps.app.outputs.token || github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          test -f amplify_outputs.json || echo '{}' > amplify_outputs.json

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Empty when the App is not set up; the action then uses its own.
          github_token: ${{ steps.app.outputs.token }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-opus-5-5
            --max-turns 250
            --allowedTools "Bash(npm test:*),Bash(npm run test:coverage),Bash(npx vitest run:*),Bash(npx tsc:*),Bash(npx eslint:*),Bash(npm run check:backend),Bash(npm run check:pr:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*)"
