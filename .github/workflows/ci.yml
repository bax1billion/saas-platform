# CI: the checks a change must pass before it merges (docs/pull-request-gates.md).
#
# No AWS credentials are used: amplify_outputs.json is stubbed (the frontend
# imports it at module scope) and `check:backend` synthesizes the backend
# entirely locally, which has caught schema, ESM and resolver errors that
# tsc and the unit tests cannot.
#
# Two jobs run side by side so a failure names itself and the wall clock
# stays short: `checks` (tests with coverage floors, both typechecks, the
# copy rules, lint, the backend synth) and `build` (the production Next
# build, which the Hosting build would otherwise be the first to run).
# Both are required checks on the default branch (the rulesets, § 5). The conventions, the
# Tier 1 hold, the secret scan and the AI review live in pr-gates.yml and
# claude-review.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stub amplify_outputs.json
        run: test -f amplify_outputs.json || echo '{}' > amplify_outputs.json

      - name: Unit tests with the coverage floors (vitest.config.ts)
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered} / ${t[k].total} |`;
              console.log("### Coverage over the pure-logic directories\n\n| Metric | Covered | Count |\n|---|---|---|\n" + ["lines","statements","branches","functions"].map(row).join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Typecheck (frontend)
        run: npx tsc --noEmit

      - name: Typecheck (backend, as ampx deploy runs it)
        run: npx tsc --noEmit -p amplify/tsconfig.json

      - name: Lint (includes the module import boundaries, docs/data-coupling.md)
        run: npx eslint . --max-warnings=0

      - name: Backend synth (local CDK assembly, cycle scan, template caps)
        run: npm run check:backend

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stub amplify_outputs.json
        run: test -f amplify_outputs.json || echo '{}' > amplify_outputs.json

      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx next build
